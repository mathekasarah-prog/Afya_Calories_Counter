<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afya Calories Counter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  </head>

  <body class="min-h-screen bg-green-50 text-gray-800">
    <header class="text-center py-8 px-4">
      <h1 class="text-4xl md:text-5xl font-bold text-green-700">
        Afya Calorie Counter
      </h1>
      <p class="mt-2 text-gray-600 text-lg">
        Track your meals. Understand your calories. Live healthier.
      </p>
    </header>

    <main class="max-w-3xl mx-auto px-4 pb-10">
      <section class="bg-white rounded-2xl shadow-lg p-6 mb-6">
        <h2 class="text-2xl font-bold text-green-700 mb-5">Add Food</h2>

        <form id="food-form" class="space-y-4">
          <label for="food-name" class="block font-semibold text-gray-700"
            >Food Name</label>
          <input
                type="text"
                id="food-name"
                name="food-name"
                placeholder="e.g Rice"
                required
            class="w-full mt-1 px-4 py-3 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus-ring-green-500"/>
          <div>
          <label
                for="calories"
                class="block font-semibold text-gray-700"
                >Calories</label>

          <div class="flex gap-2,mt-1" > 
          <input class="w-full mt-1 px-4 py-3 border border-gray-300 rounded-lg
           focus:outline-none focus:ring-2 focus:ring-green-500"
                type="number"
                id="calories"
                name="calories"
                placeholder="e.g 105"
                min="0">

          <button id="lookup-btn"
            type="button"
            class="bg-green-500 text-white px-4 py-3 rounded-lg
               hover:bg-green-600 transition duration-300">
            Find Calories
          </button>
          </div> 
          <p id="lookup-message" class="text-sm text-gray-500"></p>
          </div>
          <button
              type="submit"
              class="w-full bg-green-600 text-white font-semibold py-3
                           rounded-lg hover:bg-green-700 transition duration-300"
            >
              Add Food
          </button>
        </form>
      </section>

      <section class="bg-white rounded-2xl shadow-lg p-6 mb-6">
        <h2 class="text-2xl font-bold text-green-700 mb-5">Today's Food</h2>

        <ul id="food-list" class="space-y-3">


        </ul>
      </section>

      <section class="bg-green-700 text-white rounded-2xl shadow-lg p-6 text-center">
        <h2 class="text-2xl font-bold mb-3">Daily Summary</h2>
        <p class="text-lg">Total Calories: <span id="total-calories">0</span> kcal</p>
        <button id="reset-btn" type="button" class=" mt-5 bg-white text-green-700 font-semibold px-6 py-3 rounded-lg hover:bg-gray-100 transitionduration-300">Reset Day</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
